apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: integration-test
  namespace: jettisonproj
  labels:
    app.kubernetes.io/version: 85c7afa3c61e75bf9d76ba305d82ce287b12741b
spec:
  args:
  - name: service-name
  - name: app-under-test
  metrics:
  - name: integration-test
    provider:
      job:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 600
          template:
            metadata:
              labels:
                app: integration-test
                app.kubernetes.io/version: 85c7afa3c61e75bf9d76ba305d82ce287b12741b
                app-under-test: "{{args.app-under-test}}"
                jettison-app: "{{args.app-under-test}}"
            spec:
              containers:
              - name: integration-test
                image: ghcr.io/jettisonproj/rollouts-demo-integration-test:85c7afa3c61e75bf9d76ba305d82ce287b12741b
                args:
                - "./integration-test.sh"
                - "http://{{args.service-name}}"
              restartPolicy: Never
