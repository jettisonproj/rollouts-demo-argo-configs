apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: integration-test
  namespace: jettisonproj
  labels:
    app.kubernetes.io/version: 255d685ce0a1216c6b89c0e30dce6c7959a9b9a9
spec:
  args:
  - name: service-name
  - name: app-under-test
  metrics:
  - name: integration-test
    provider:
      job:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 600
          template:
            metadata:
              labels:
                app: integration-test
                app.kubernetes.io/version: 255d685ce0a1216c6b89c0e30dce6c7959a9b9a9
                app-under-test: "{{args.app-under-test}}"
                jettison-app: "{{args.app-under-test}}"
            spec:
              containers:
              - name: integration-test
                image: ghcr.io/jettisonproj/rollouts-demo-integration-test:255d685ce0a1216c6b89c0e30dce6c7959a9b9a9
                args:
                - "./integration-test.sh"
                - "http://{{args.service-name}}"
              restartPolicy: Never
